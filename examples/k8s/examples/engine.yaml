# engine.yaml - Engine for running the demo streams
apiVersion: io.tram.core/v1alpha1
kind: Engine
metadata:
  name: demo
spec:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  ports:
    - name: otlp-basic
      port: 4318
    - name: otlp-batch
      port: 4319
    - name: otlp-multi-sink
      port: 4320
    - name: otlp-secure
      port: 4321
    - name: otlp-filters
      port: 4322
    - name: otlp-validation
      port: 4323
    - name: bench-otlp-nats
      port: 4324
    - name: bench-batch
      port: 4325
    - name: bench-split
      port: 4326
    - name: otlp-debug
      port: 4327
    - name: otlp-buffer
      port: 4328
    - name: otlp-grpc
      port: 4317
    - name: otlp-grpc-http
      port: 4329
    - name: otlp-transform
      port: 4330
    - name: tenant-http
      port: 4331
    - name: tenant-grpc
      port: 4332
  runtime:
    logLevel: info
  # Uncomment to give every instance a volume for buffer queues, so
  # otlp-to-buffer and buffer-to-otlp run. The manager then runs the
  # instances as a StatefulSet.
  # storage:
  #   size: 1Gi
