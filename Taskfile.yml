# Tasks for developing Tram. Run `task` to list them, and
# `task --summary <name>` for details on one. Arguments after `--` are passed
# on, e.g. `task test:unit -- -run TestBatch`.
#
# Install Task from https://taskfile.dev.

version: '3'

vars:
  BINARY: tram
  IMAGE: tram:dev
  # The packages to lint and test, as directories relative to the module:
  # all but tools/loadgen, a local tool that is not part of the repository.
  PACKAGES:
    sh: go list ./... | grep -v /tools/loadgen | sed "s#^$(go list -m)#.#" | tr '\n' ' '
  # Podman if installed, Docker otherwise; set CONTAINER_TOOL=docker to choose.
  CONTAINER_TOOL:
    sh: command -v podman >/dev/null 2>&1 && echo podman || echo docker
  # The socket of the Podman service, as Podman reports it: the rootless or
  # rootful socket on Linux, the socket inside the machine on macOS and
  # Windows. Testcontainers' Ryuk container mounts it from there; the default
  # /var/run/docker.sock is often missing or points to an inactive socket.
  PODMAN_SOCKET:
    sh: >-
      podman info --format '{{`{{.Host.RemoteSocket.Path}}`}}' 2>/dev/null
      || echo /run/podman/podman.sock
  # Whether Podman runs in a machine. Only a local service is reachable at
  # PODMAN_SOCKET; for a machine, Testcontainers finds the forwarded socket.
  PODMAN_REMOTE:
    sh: podman info --format '{{`{{.Host.ServiceIsRemote}}`}}' 2>/dev/null || echo true
  # Testcontainers needs this setup with Podman; with Docker it works as is.
  # The socket override must not be set at all for Docker, even empty. A
  # DOCKER_HOST already set is kept.
  TESTCONTAINERS_ENV: >-
    {{if eq .CONTAINER_TOOL "podman"}}{{if eq .PODMAN_REMOTE "false"}}DOCKER_HOST="${DOCKER_HOST:-unix://{{.PODMAN_SOCKET}}}"
    {{end}}TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE={{.PODMAN_SOCKET}}
    TESTCONTAINERS_RYUK_CONTAINER_PRIVILEGED=true{{end}}

  # Tool versions installed by `task tools`, matching the generated code.
  BUF_VERSION: v1.50.0
  PROTOC_GEN_GO_VERSION: v1.36.5
  PROTOC_GEN_GO_GRPC_VERSION: v1.5.1
  GRPC_GATEWAY_VERSION: v2.26.1
  CONTROLLER_GEN_VERSION: v0.22.0
  GOLANGCI_LINT_VERSION: v2.15.0
  SETUP_ENVTEST_VERSION: v0.25.2
  KUBECONFORM_VERSION: v0.8.0
  # svu computes release versions from the tags; run with `go run`, so it
  # needs no install.
  SVU_VERSION: v3.4.4
  ENVTEST_K8S_VERSION: 1.37.0

tasks:
  default:
    desc: List all tasks
    silent: true
    cmds:
      - task --list

  # --- Build and run -------------------------------------------------------

  build:
    desc: Build the tram binary
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.BINARY}}'
    cmds:
      - go build -o {{.BINARY}} ./cmd/tram

  run:
    desc: Run the server locally (pass flags after --, e.g. -- --enable-file-sync)
    cmds:
      - go run ./cmd/tram server {{.CLI_ARGS}}

  generate:
    desc: Regenerate protobuf, gRPC gateway and swagger code (buf) and the Kubernetes CRD (controller-gen)
    preconditions:
      - sh: command -v buf
        msg: buf is missing; run `task tools`
      - sh: command -v controller-gen
        msg: controller-gen is missing; run `task tools`
    cmds:
      - go generate ./...

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  clean:
    desc: Remove build and benchmark output
    cmds:
      - rm -f {{.BINARY}} benchreport bench.txt coverage.out

  # --- Code quality --------------------------------------------------------

  lint:
    desc: Run golangci-lint, including go vet
    cmds:
      - golangci-lint run {{.CLI_ARGS}} {{.PACKAGES}}

  chart:lint:
    desc: Lint the Helm chart and validate what it renders against the Kubernetes schemas (needs helm and kubeconform)
    preconditions:
      - sh: command -v helm
        msg: helm is missing; install it, see https://helm.sh/docs/intro/install/
      - sh: command -v kubeconform
        msg: kubeconform is missing; run `task tools`
    vars:
      # kubeconform's default schemas lack the one of CustomResourceDefinition,
      # which is recursive; the schemas with references to each other have it.
      KUBECONFORM_ARGS: >-
        -strict -summary -schema-location default
        -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/{{`{{.ResourceKind}}{{.KindSuffix}}`}}.json'
    cmds:
      - helm lint --strict charts/tram
      # The default values, then the options that change what is rendered.
      - helm template tram charts/tram --namespace tram-system | kubeconform {{.KUBECONFORM_ARGS}}
      - >-
        helm template tram charts/tram --namespace tram-system
        --set 'manager.watchNamespaces={team-a,team-b}'
        --set 'manager.extraArgs={--log-level=debug}'
        --set 'imagePullSecrets[0].name=registry'
        --set serviceAccount.create=false --set serviceAccount.name=tram
        --set podLabels.team=observability --set podAnnotations.example=yes
        --set 'tolerations[0].operator=Exists'
        | kubeconform {{.KUBECONFORM_ARGS}}

  fmt:
    desc: Format the code with the formatters configured for golangci-lint (goimports, golines)
    cmds:
      - golangci-lint fmt ./...

  check:
    desc: Run everything a change should pass, without containers - lint, unit and end-to-end tests
    cmds:
      - task: lint
      - task: test:unit
      - task: test:e2e

  ci:
    desc: Run what the CI workflows run, ci:lint, ci:test and ci:chart, one after the other
    cmds:
      - task: ci:lint
      - task: ci:test
      - task: ci:chart

  ci:lint:
    desc: Run the CI lint job - install the pinned golangci-lint, then task lint
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - task: lint

  ci:chart:
    desc: Run the CI chart job - check that the chart's and manifests' CRDs and roles are generated, then task chart:lint
    summary: |
      Installs the pinned controller-gen and kubeconform, regenerates the
      CRDs and roles into manifests/ and charts/tram and fails if that
      changes them, i.e. if they were not regenerated after a change to the
      types or RBAC markers; then lints and validates the chart. Commit or
      stash changes under manifests/ and charts/ before running it locally.
    cmds:
      - go install sigs.k8s.io/controller-tools/cmd/controller-gen@{{.CONTROLLER_GEN_VERSION}}
      - go install github.com/yannh/kubeconform/cmd/kubeconform@{{.KUBECONFORM_VERSION}}
      - go generate ./internal/adapters/k8scrd/
      - |
        changed="$(git status --porcelain -- manifests charts internal/adapters/k8scrd)"
        if [ -n "$changed" ]; then
          echo "$changed"
          echo "The generated CRDs and roles are out of date; run task generate and commit them" >&2
          exit 1
        fi
      - task: chart:lint

  ci:test:
    desc: Run the CI test job - unit and end-to-end tests
    cmds:
      - task: test:unit
      - task: test:e2e

  test:all:
    desc: Run every check - lint, unit, end-to-end, container and operator (envtest) tests; fails instead of skipping
    summary: |
      Runs `task check`, then the tests that `task test` would skip without a
      container runtime or KUBEBUILDER_ASSETS. Fails up front if Podman or
      Docker is not running or setup-envtest is missing, instead of after the
      lint and unit tests.
    preconditions:
      - sh: '{{.CONTAINER_TOOL}} info >/dev/null 2>&1'
        msg: '{{.CONTAINER_TOOL}} is not running; start it first (e.g. `podman machine start`)'
      - sh: command -v setup-envtest
        msg: setup-envtest is missing; run `task tools`
    cmds:
      - task: check
      - task: test:containers
      - task: test:envtest

  # --- Tests ---------------------------------------------------------------

  test:
    desc: Run all tests; tests that need containers are skipped without Docker or Podman
    cmds:
      - '{{.TESTCONTAINERS_ENV}} go test -race {{.CLI_ARGS}} {{.PACKAGES}}'

  test:unit:
    desc: Run the unit tests of all packages, without the end-to-end tests
    cmds:
      - '{{.TESTCONTAINERS_ENV}} go test -race {{.CLI_ARGS}} $(echo {{.PACKAGES}} | tr " " "\n" | grep -v /internal/e2e)'

  test:e2e:
    desc: Run the end-to-end pipeline tests that need no containers
    cmds:
      - "{{.TESTCONTAINERS_ENV}} go test -race -skip '^TestBroker(NATS|Kafka|AMQP)$' {{.CLI_ARGS}} ./internal/e2e/"

  test:containers:
    desc: Run the end-to-end tests against NATS, Kafka and AMQP (ActiveMQ Artemis) in containers (Testcontainers; needs Docker or Podman)
    summary: |
      Runs the tests that start NATS, Kafka and Artemis with Testcontainers. Unlike in
      `task test`, they fail instead of being skipped if no container runtime
      is running. Results are never cached, since they depend on the
      container. With Podman, the socket Podman reports is used; see
      PODMAN_SOCKET.
    preconditions:
      - sh: '{{.CONTAINER_TOOL}} info >/dev/null 2>&1'
        msg: '{{.CONTAINER_TOOL}} is not running; start it first (e.g. `podman machine start`)'
    cmds:
      - "{{.TESTCONTAINERS_ENV}} go test -race -count=1 -run '^TestBroker(NATS|Kafka|AMQP)$' {{.CLI_ARGS}} ./internal/e2e/"

  test:envtest:
    desc: Run the Kubernetes operator tests against a real API server and etcd (envtest)
    summary: |
      Downloads kube-apiserver and etcd for ENVTEST_K8S_VERSION with
      setup-envtest on first use and runs the operator tests against them.
      Without KUBEBUILDER_ASSETS, e.g. in `task test`, these tests are skipped.
    preconditions:
      - sh: command -v setup-envtest
        msg: setup-envtest is missing; run `task tools`
    cmds:
      - >-
        KUBEBUILDER_ASSETS="$(setup-envtest use {{.ENVTEST_K8S_VERSION}} -p path)"
        go test -race -count=1 -run '^TestOperator' {{.CLI_ARGS}} ./internal/adapters/k8scrd/

  test:cover:
    desc: Run all tests with coverage and show the total; the full report is in coverage.out
    cmds:
      - '{{.TESTCONTAINERS_ENV}} go test -coverprofile=coverage.out ./...'
      - go tool cover -func=coverage.out | tail -n 1
      - 'echo "Open the report with: go tool cover -html=coverage.out"'

  # --- Benchmarks ----------------------------------------------------------

  bench:
    desc: Run benchmarks (BENCH=regexp, PKG=packages, COUNT=runs, BENCHTIME=duration)
    summary: |
      Runs the benchmarks one package at a time, so they do not compete for
      CPU. Benchmarks that need NATS start it in a container and are skipped
      without Docker or Podman.

        task bench BENCH=Batch PKG=./internal/adapters/stage/batch/
        task bench COUNT=10 > old.txt

      Compare two runs with `task bench:compare OLD=old.txt NEW=new.txt`.
    vars:
      BENCH: '{{.BENCH | default "."}}'
      PKG: '{{.PKG | default "./..."}}'
      COUNT: '{{.COUNT | default "1"}}'
      BENCHTIME: '{{.BENCHTIME | default "1s"}}'
    cmds:
      - >-
        {{.TESTCONTAINERS_ENV}} go test -p 1 -run '^$' -bench '{{.BENCH}}' -benchmem
        -count {{.COUNT}} -benchtime {{.BENCHTIME}} {{.CLI_ARGS}} {{.PKG}}

  bench:compare:
    desc: Compare two benchmark outputs with benchstat (OLD=file NEW=file)
    requires:
      vars: [OLD, NEW]
    preconditions:
      - sh: command -v benchstat
        msg: benchstat is missing; run `task tools`
    cmds:
      - benchstat {{.OLD}} {{.NEW}}

  bench:report:
    desc: Run all benchmarks and regenerate BENCHMARK.md (takes several minutes, needs Docker or Podman)
    summary: |
      Runs tools/benchreport, which runs the benchmarks, writes their results
      into the generated sections of BENCHMARK.md and saves the raw output to
      bench.txt. Pass benchreport's flags after --, e.g. `-- -count 5`.
      Rebuild the page from bench.txt without running the benchmarks again
      with `task bench:report:from-raw`.
    preconditions:
      - sh: '{{.CONTAINER_TOOL}} info >/dev/null 2>&1'
        msg: '{{.CONTAINER_TOOL}} is not running; start it first (e.g. `podman machine start`)'
    cmds:
      - '{{.TESTCONTAINERS_ENV}} go run ./tools/benchreport -raw bench.txt {{.CLI_ARGS}}'

  bench:report:from-raw:
    desc: Regenerate BENCHMARK.md from the benchmark output saved in bench.txt
    preconditions:
      - sh: test -f bench.txt
        msg: bench.txt is missing; run `task bench:report` first
    cmds:
      - go run ./tools/benchreport -input bench.txt {{.CLI_ARGS}}

  # --- Container image -----------------------------------------------------

  image:build:
    desc: Build the container image (IMAGE=name, default tram:dev)
    cmds:
      - '{{.CONTAINER_TOOL}} build -t {{.IMAGE}} .'

  image:run:
    desc: Run the container image with the HTTP and gRPC APIs on localhost:8080 and localhost:50051
    deps: [image:build]
    cmds:
      - '{{.CONTAINER_TOOL}} run --rm -p 8080:8080 -p 50051:50051 {{.IMAGE}} {{.CLI_ARGS}}'

  # --- Release -------------------------------------------------------------

  release:next:
    desc: Tag the version the Conventional Commits since the last tag call for (at least a patch) and push it
    cmds:
      - task: release
        vars: { BUMP: next --always }

  release:patch:
    desc: Tag the next patch version on main and push it; the release workflow then builds and publishes the image
    cmds:
      - task: release
        vars: { BUMP: patch }

  release:minor:
    desc: Tag the next minor version on main and push it; the release workflow then builds and publishes the image
    cmds:
      - task: release
        vars: { BUMP: minor }

  release:major:
    desc: Tag the next major version on main and push it; the release workflow then builds and publishes the image
    cmds:
      - task: release
        vars: { BUMP: major }

  release:
    internal: true
    requires:
      vars: [BUMP]
    vars:
      VERSION:
        sh: go run github.com/caarlos0/svu/v3@{{.SVU_VERSION}} {{.BUMP}}
    preconditions:
      - sh: test "$(git branch --show-current)" = main
        msg: Releases are tagged on main; switch to main first
      - sh: test -z "$(git status --porcelain --untracked-files=no)"
        msg: The working tree has uncommitted changes
      - sh: git fetch --quiet origin main && test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
        msg: main differs from origin/main; pull or push first
    cmds:
      - task: check
      - git tag -a {{.VERSION}} -m "Release {{.VERSION}}"
      - git push origin {{.VERSION}}
      - echo "Tagged and pushed {{.VERSION}}"

  # --- Local services ------------------------------------------------------

  nats:up:
    desc: Start a local NATS server with JetStream on localhost:4222
    cmds:
      - '{{.CONTAINER_TOOL}} compose -f examples/nats/docker-compose.yaml up -d'

  nats:down:
    desc: Stop the local NATS server
    cmds:
      - '{{.CONTAINER_TOOL}} compose -f examples/nats/docker-compose.yaml down'

  demo:up:
    desc: Start the demo that sends logs, metrics and traces through Tram to OpenObserve, with Grafana on localhost:3000 (see examples/demo/README.md)
    cmds:
      - '{{.CONTAINER_TOOL}} compose -f examples/demo/compose.yaml up -d --build'

  demo:down:
    desc: Stop the demo and remove its containers
    cmds:
      - '{{.CONTAINER_TOOL}} compose -f examples/demo/compose.yaml down'

  k8s:crd:
    desc: Install the Stream CRD into the current Kubernetes context
    cmds:
      - kubectl apply -f manifests/crds/io.tram.core_streams.yaml

  # --- Tools ---------------------------------------------------------------

  tools:
    desc: Install the tools for code generation, linting and benchmark comparison into GOBIN
    cmds:
      - go install github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}}
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@{{.PROTOC_GEN_GO_GRPC_VERSION}}
      - go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@{{.GRPC_GATEWAY_VERSION}}
      - go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@{{.GRPC_GATEWAY_VERSION}}
      - go install sigs.k8s.io/controller-tools/cmd/controller-gen@{{.CONTROLLER_GEN_VERSION}}
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install golang.org/x/perf/cmd/benchstat@latest
      - go install sigs.k8s.io/controller-runtime/tools/setup-envtest@{{.SETUP_ENVTEST_VERSION}}
      - go install github.com/yannh/kubeconform/cmd/kubeconform@{{.KUBECONFORM_VERSION}}
