# Validates pull requests and pushes to main with golangci-lint (`task ci:lint`),
# unit and end-to-end tests (`task ci:test`) and the Helm chart
# (`task ci:chart`), as parallel jobs.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lint, test, chart]
    env:
      TASK_VERSION: v3.54.0
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}

      - name: Start Podman
        run: systemctl --user start podman.socket

      - name: Check
        run: task ci:${{ matrix.target }}
