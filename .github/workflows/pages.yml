# Builds the documentation in docs/ with Zensical and publishes it to the
# root of the pages branch, which GitHub Pages serves at https://go-tram.github.io/TRAM/
# through a webhook of the repository. A version tag rebuilds it from main,
# so the Releases page lists the new release.
name: Pages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - docs/**
      - README.md
      - COMPONENTS.md
      - BENCHMARK.md
      - CONTRIBUTING.md
      - internal/adapters/k8scrd/README.md
      - cliff.toml
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Has git and Python, so the job needs neither Node.js nor actions.
    container:
      image: python:3.13
    env:
      # Canonical repository path
      REPO: GO-TRAM/TRAM
    steps:
      # The full history with the tags, for the Releases page. For a tag,
      # main is built as it is, since the tag is on main.
      - name: Check out main
        run: |
          git clone --quiet --branch main \
            "https://${GITHUB_TOKEN}@github.com/${REPO}.git" src
          if [ "${GITHUB_REF_TYPE}" = branch ]; then
            git -C src checkout --quiet "${GITHUB_SHA}"
          fi

      - name: Build site
        working-directory: src
        run: |
          pip install --quiet --root-user-action=ignore -r docs/requirements.txt
          python docs/generate.py
          zensical build --strict -f docs/zensical.toml

      - name: Push to pages branch
        run: |
          ssh_dir="${HOME}/.ssh"
          mkdir -p "$ssh_dir"
          chmod 700 "$ssh_dir"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "$ssh_dir/id_deploy"
          chmod 600 "$ssh_dir/id_deploy"
          ssh-keyscan -t ed25519,rsa,ecdsa github.com > "$ssh_dir/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/id_deploy -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"

          remote="git@github.com:${REPO}.git"
          if git clone --quiet --depth 1 --branch pages "$remote" pages; then
            find pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            git init --quiet --initial-branch pages pages
            git -C pages remote add origin "$remote"
          fi
          cp -r src/docs/site/. pages/

          cd pages
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Site unchanged, nothing to publish"
            exit 0
          fi
          git commit --quiet -m "Publish documentation from ${GITHUB_SHA}"
          git push origin pages
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
