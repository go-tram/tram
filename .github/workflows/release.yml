# Builds and publishes a release for a version tag on main: the container
# image, the Helm chart and the manifests, all with the version of the tag,
# and the GitHub Release with the release notes git-cliff makes from the
# commit messages since the previous tag (see cliff.toml).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/go-tram/tram

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [lint, test, chart]
    env:
      TASK_VERSION: v3.54.0
    steps:
      - name: Check out the tag and main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag to be on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "${GITHUB_REF_NAME} is not on main; only tags on main are released" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}

      - name: Start Podman
        run: systemctl --user start podman.socket

      - name: Check
        run: task ci:${{ matrix.target }}

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      CHARTS: oci://ghcr.io/go-tram/charts
    steps:
      - name: Check out the tag with the history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"

      # Helm and kubectl come with the runner.
      - name: Package the chart
        run: |
          helm version
          helm package charts/tram --version "${VERSION}" --app-version "${VERSION}" --destination dist

      - name: Render the manifests
        run: |
          sed -i "s/^    newTag: latest$/    newTag: ${VERSION}/" manifests/tram-manager/kustomization.yaml
          sed -i "s|--engine-image=${IMAGE}:latest$|--engine-image=${IMAGE}:${VERSION}|" manifests/tram-manager/deployment.yaml
          kubectl kustomize manifests/ > dist/tram.yaml
          grep -q "image: ${IMAGE}:${VERSION}$" dist/tram.yaml
          grep -q -- "--engine-image=${IMAGE}:${VERSION}$" dist/tram.yaml

      - name: Push the chart
        env:
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io --username "${ACTOR}" --password-stdin
          helm push "dist/tram-${VERSION}.tgz" "${CHARTS}"

      # The version of git-cliff comes from docs/requirements.txt, which
      # Dependabot updates, so the Releases page of the documentation uses
      # the same.
      - name: Write the release notes
        run: |
          python3 -m venv "${RUNNER_TEMP}/cliff"
          "${RUNNER_TEMP}/cliff/bin/pip" install --quiet "$(grep '^git-cliff' docs/requirements.txt)"
          "${RUNNER_TEMP}/cliff/bin/git-cliff" --current --strip header --output dist/notes.md
          cat dist/notes.md

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(dist/tram.yaml "dist/tram-${VERSION}.tgz")
          # A Release made by hand keeps its notes.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" --verify-tag --notes-file dist/notes.md --title "${GITHUB_REF_NAME}"
          fi
