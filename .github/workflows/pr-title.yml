# Checks that the title of a pull request follows Conventional Commits
# (https://www.conventionalcommits.org), e.g. `feat(k8s): drain buffers`.
# Pull requests are squash-merged with their title as the commit message, so
# the title is what lands on main; the commits of the branch are not checked.
# The ruleset of main requires this check.

name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
