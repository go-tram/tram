name: Feature request
description: Suggest a new component, option or capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what keeps you from doing it with TRAM today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How TRAM could solve it, e.g. a new source, stage or sink, or an option of an existing one. A sketch of the stream configuration helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today or other solutions you considered.

  - type: dropdown
    id: contribute
    attributes:
      label: Would you implement it?
      description: See CONTRIBUTING.md for how components are added.
      options:
        - "Yes"
        - With some help
        - "No"
