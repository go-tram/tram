# Zensical configuration. The site is built with `zensical build -f
# docs/zensical.toml` after `python docs/generate.py` generated the guide,
# components, operator, benchmark and contributing pages in content/ from
# the Markdown files of the repository, and the releases page from the git
# tags with git-cliff; the images come from assets/.

[project]
site_name = "TRAM"
site_description = "A lightweight, extensible pipeline framework for logs, metrics and traces"
site_url = "https://gotram.dev/"
repo_url = "https://github.com/GO-TRAM/TRAM"
repo_name = "GO-TRAM/TRAM"

docs_dir = "content"
site_dir = "site"

# Lets `zensical serve` rebuild when the documents generate.py reads change.
# The generated pages themselves only change when generate.py runs again.
watch = [
  "assets",
  "../README.md",
  "../COMPONENTS.md",
  "../BENCHMARK.md",
  "../CONTRIBUTING.md",
  "../internal/adapters/k8scrd/README.md",
  "../charts/tram/README.md",
  "../examples/config/README.md",
  "../examples/k8s/README.md",
  "../examples/tests/README.md",
  "../cliff.toml",
]

nav = [
  { "Home" = "index.md" },
  { "Guide" = [
      { "Getting Started" = "guide/getting-started.md" },
      { "Streams" = "guide/streams.md" },
      { "Testing Streams" = "guide/testing.md" },
      { "Sending Data to TRAM" = "guide/sending-data.md" },
      { "HTTP API" = "guide/api.md" },
      { "Security" = "guide/security.md" },
  ] },
  { "Components" = [
      { "Overview" = "components/index.md" },
      { "Sources" = [
          "components/sources/index.md",
          { "Broker" = "components/sources/broker.md" },
          { "Buffer" = "components/sources/buffer.md" },
          { "Generator" = "components/sources/generator.md" },
          { "OTLP" = "components/sources/otlp.md" },
      ] },
      { "Stages" = [
          "components/stages/index.md",
          { "Batch" = "components/stages/batch.md" },
          { "Decryption" = "components/stages/decryption.md" },
          { "Delay" = "components/stages/delay.md" },
          { "Encryption" = "components/stages/encryption.md" },
          { "Filter" = "components/stages/filter.md" },
          { "No-op" = "components/stages/no-op.md" },
          { "Validation" = "components/stages/validation.md" },
          { "Value Map" = "components/stages/value-map.md" },
          { "Transform" = "components/stages/transform.md" },
      ] },
      { "Sinks" = [
          "components/sinks/index.md",
          { "Broker" = "components/sinks/broker.md" },
          { "Buffer" = "components/sinks/buffer.md" },
          { "Debug" = "components/sinks/debug.md" },
          { "OTLP" = "components/sinks/otlp.md" },
      ] },
  ] },
  { "Deployment" = [
      { "Container & Binary" = "deployment/container.md" },
      { "Kubernetes" = [
          "deployment/kubernetes/index.md",
          { "Helm Chart" = "deployment/kubernetes/helm.md" },
          { "Engines" = "deployment/kubernetes/engines.md" },
          { "Storage for Buffers" = "deployment/kubernetes/storage.md" },
          { "Stream Resources" = "deployment/kubernetes/streams.md" },
      ] },
      { "Examples" = [
          { "Streams" = "deployment/examples/streams.md" },
          { "Kubernetes" = "deployment/examples/kubernetes.md" },
          { "Tests" = "deployment/examples/tests.md" },
      ] },
  ] },
  { "Operations" = [
      { "Metrics" = "operations/metrics.md" },
      { "Benchmarks" = "operations/benchmarks.md" },
  ] },
  { "Development" = [
      { "Contributing" = "development/contributing.md" },
      { "Releases" = "development/releases.md" },
      { "Decisions" = [
          "development/decisions/index.md",
          { "0001: Record Architecture Decisions" = "development/decisions/0001-record-architecture-decisions.md" },
          { "0002: OTLP as the Data Model of the Core" = "development/decisions/0002-otlp-as-the-data-model.md" },
          { "0003: Ports and Adapters" = "development/decisions/0003-ports-and-adapters.md" },
          { "0004: Components as Concept and Driver" = "development/decisions/0004-components-as-concept-and-driver.md" },
          { "0005: Events Are Shared and Read-Only" = "development/decisions/0005-events-are-read-only.md" },
          { "0006: At-Least-Once Delivery Without Deduplication" = "development/decisions/0006-at-least-once-delivery.md" },
          { "0007: Synchronous Delivery and Backpressure" = "development/decisions/0007-synchronous-delivery-and-backpressure.md" },
          { "0008: Requests Are Accepted or Refused as a Whole" = "development/decisions/0008-requests-accepted-or-refused-as-a-whole.md" },
          { "0009: No Authentication or Authorization in TRAM" = "development/decisions/0009-no-authentication-in-tram.md" },
          { "0010: One Set of Streams, the Last Write Wins" = "development/decisions/0010-one-stream-state-last-write-wins.md" },
          { "0011: Transform Stage With a CEL Driver, Attributes Only" = "development/decisions/0011-transform-stage.md" },
          { "0012: Object Storage Sink With S3 as Its First Driver" = "development/decisions/0012-object-storage-sink.md" },
          { "0013: A Driver for value_map Only When Needed" = "development/decisions/0013-value-map-driver.md" },
          { "0014: Releases From Conventional Commits" = "development/decisions/0014-releases-from-conventional-commits.md" },
          { "0015: Streams Keep Nothing on Disk; Buffers Connect Two Streams" = "development/decisions/0015-persistence-between-streams.md" },
          { "0016: Limit the Request Size at the Source, Decompressed" = "development/decisions/0016-request-size-limit-at-the-source.md" },
          { "0018: Stream Resources Own Their Streams" = "development/decisions/0018-resources-own-their-streams.md" },
      ] },
  ] },
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/sortable-tables.js"]

[project.theme]
language = "en"
logo = "assets/TRAM.png"
favicon = "assets/TRAM.svg"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "search.suggest",
  "toc.follow",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle = { icon = "lucide/moon", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle = { icon = "lucide/sun", name = "Switch to light mode" }

[project.theme.icon]
repo = "simple/github"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/GO-TRAM/TRAM"
name = "TRAM on GitHub"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"

[project.validation.links]
anchors = "warn"
