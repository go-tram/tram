syntax = "proto3";
package tram.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/go-tram/tram/pkg/gen/go/tram/v1;tramv1";

//------------------------------------------------------------------------------
// Domain definitions
//------------------------------------------------------------------------------

message Source {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string type = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Struct spec = 3;
}

message Stage {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string type = 2 [(buf.validate.field).string.min_len = 1];
  string from = 3;
  google.protobuf.Struct spec = 4;
}

message Sink {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string type = 2 [(buf.validate.field).string.min_len = 1];
  string from = 3;
  google.protobuf.Struct spec = 4;
}

// Enables a metric per kind of node. Unset fields keep their defaults.
message NodeMetrics {
  // Defaults to true.
  optional bool source = 1;
  // Defaults to false.
  optional bool stages = 2;
  // Defaults to true.
  optional bool sinks = 3;
}

// Chooses the metrics a stream records. Unset fields keep their defaults.
message Metrics {
  // tram.node.records and tram.node.records.out.
  NodeMetrics records = 1;
  // tram.node.duration.
  NodeMetrics duration = 2;
  // tram.source.request.size. Defaults to true.
  optional bool request_size = 3;
}

message Stream {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  Source source = 2;
  repeated Stage stages = 3;
  repeated Sink sinks = 4 [(buf.validate.field).repeated.min_items = 1];
  Metrics metrics = 5;
  // When true, the stream is defined but its source does not run: no ports
  // are opened and no consumers are attached. Used to pause a stream, e.g.
  // the writer of a buffer while its queue is drained.
  optional bool suspended = 6;
}

//------------------------------------------------------------------------------
// Payload definitions
//------------------------------------------------------------------------------

// What an upsert of a stream would do, without applying it.
enum StreamPlanAction {
  STREAM_PLAN_ACTION_UNSPECIFIED = 0;
  // The stream is unchanged, nothing would happen.
  STREAM_PLAN_ACTION_NOOP = 1;
  // The source is unchanged and keeps running; its stages and sinks are
  // replaced below it ("hot swap").
  STREAM_PLAN_ACTION_HOT_SWAP = 2;
  // The stream is new, stopped, or its source changed: it is stopped and
  // rebuilt completely.
  STREAM_PLAN_ACTION_REBUILD = 3;
}

// The plan of an upsert, computed by a dry run. Node names are unique within
// a stream.
message StreamPlan {
  StreamPlanAction action = 1;
  // True when the source would be replaced, i.e. the action is REBUILD and
  // the stream already existed with another source.
  bool source_replaced = 2;
  // Stages and sinks that would be created, by name.
  repeated string created_nodes = 3;
  // Stages and sinks that would be stopped, by name.
  repeated string stopped_nodes = 4;
}

message PutStreamRequest {
  Stream stream = 1;
  // When true, the stream is validated and planned but not applied; the
  // response holds the plan instead of changing the running stream.
  bool dry_run = 2;
}

message PutStreamResponse {
  Stream stream = 1;
  // Set when the request's dry_run is true.
  StreamPlan plan = 2;
}

message GetStreamRequest {
  string name = 1;
}

message GetStreamResponse {
  Stream stream = 1;
}

message DeleteStreamRequest {
  string name = 1;
}

message DeleteStreamResponse {}

message ListStreamsRequest {}

message ListStreamsResponse {
  // All streams, ordered by name.
  repeated Stream streams = 1;
}

service StreamService {
  rpc PutStream(PutStreamRequest) returns (PutStreamResponse) {
    option (google.api.http) = {
      put: "/v1/streams/{stream.name}"
      body: "*"
    };
  }
  rpc GetStream(GetStreamRequest) returns (GetStreamResponse) {
    option (google.api.http) = {get: "/v1/streams/{name}"};
  }
  rpc DeleteStream(DeleteStreamRequest) returns (DeleteStreamResponse) {
    option (google.api.http) = {delete: "/v1/streams/{name}"};
  }
  rpc ListStreams(ListStreamsRequest) returns (ListStreamsResponse) {
    option (google.api.http) = {get: "/v1/streams"};
  }
}
