{{- /*
The CRDs, generated by controller-gen into files/crds. They are templates,
not files in Helm's crds/ directory, so helm upgrade updates them along with
the manager, and they are kept when the release is uninstalled: deleting them
would delete every Engine and Stream of the cluster.
*/}}
{{- if .Values.crds.install }}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $annotations := merge (dict "helm.sh/resource-policy" "keep") (default (dict) $crd.metadata.annotations) }}
{{- $_ := set $crd.metadata "annotations" $annotations }}
{{- $_ := set $crd.metadata "labels" (merge (default (dict) $crd.metadata.labels) (include "tram.labels" $ | fromYaml)) }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
