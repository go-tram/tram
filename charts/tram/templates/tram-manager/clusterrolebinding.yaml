{{- /*
Binds the manager's role, rbac/manager/role.yaml, to its service account:
cluster-wide, or with manager.watchNamespaces only in those namespaces and the
release's, where the leader election lease is.
*/}}
{{- $namespaces := (include "tram.watchNamespaces" . | fromJsonArray) }}
{{- if not $namespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tram.fullname" . }}
  labels:
    {{- include "tram.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tram-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "tram.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range append $namespaces .Release.Namespace | uniq }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tram.fullname" $ }}
  namespace: {{ . }}
  labels:
    {{- include "tram.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tram-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "tram.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
