{{- /* Binds the manager's role, rbac/manager/role.yaml, to its service account. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tram.fullname" . }}
  labels:
    {{- include "tram.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tram-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "tram.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
