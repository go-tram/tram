apiVersion: apps/v1
kind: Deployment
metadata:
  name: tram-manager
  namespace: tram-system
  labels:
    app.kubernetes.io/name: tram-manager
spec:
  replicas: 2 # one leader works at a time, the other takes over
  selector:
    matchLabels:
      app.kubernetes.io/name: tram-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tram-manager
    spec:
      serviceAccountName: tram-manager
      securityContext:
        runAsNonRoot: true
        # The image's user, nonroot; runAsNonRoot needs it as a number.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/go-tram/tram # tag set in kustomization.yaml
          args:
            - manager
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
